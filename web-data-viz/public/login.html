<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DBK</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

    <div class="container">
        <div class="lado-esquerdo">
        </div>

        <div class="lado-direito">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro" style="display: none;">
                </div>
            </div>

            <div class="topo">
                <div class="abas">
                    <div class="aba"><a href="./cadastro.html">Cadastro</a></div>
                    <div class="aba aba-ativa"><a href="./login.html">Login</a></div>
                </div>
                <a href="./index.html">
                    <div class="btn-voltar">Voltar</div>
                </a>
            </div>

            <div class="titulo">
                <div class="titulo-destaque">LOGIN</div>
            </div>

            <div class="formulario">
                <div class="campo campo-inteiro">
                    <div class="rotulo">Email:</div>
                    <input type="email" placeholder="Login" id="email_input">
                </div>
                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="*****" id="senha_input">
                </div>

                <div class="btn-finalizar" onclick="entrar()">ENTRAR <img src="./Assets/img-login.png" alt=""></div>
                <div id="mensagem_cadastro"></div>
                <span id="mensagem_erro"></span>

            </div>
        </div>
    </div>

    <script>
        function entrar() {
            if (typeof aguardar === 'function') {
                aguardar();
            }

            var emailVar = email_input.value;
            var senhaVar = senha_input.value;

            if (emailVar == "" || senhaVar == "") {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">Preencha todos os campos para prosseguir!</p>`;
                if (typeof finalizarAguardar === 'function') {
                    finalizarAguardar();
                }
                return false;
            } 

            console.log("FORM LOGIN: ", emailVar);
            console.log("FORM SENHA: ", senhaVar);

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                console.log("ESTOU NO THEN DO entrar()!");

                if (resposta.ok) {
                    console.log(resposta);

                    resposta.json().then(json => {
                        console.log(json);
                        console.log(JSON.stringify(json));
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;

                        setTimeout(function () {
                            window.location = "./mural.html";
                        }, 1000);

                    });

                } else {
                    console.log("Houve um erro ao tentar realizar o login!");

                    resposta.text().then(texto => {
                        console.error(texto);
                        cardErro.style.display = "block";
                        mensagem_erro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">E-mail ou senha inválidos!</p>`;
                        if (typeof finalizarAguardar === 'function') {
                            finalizarAguardar(texto);
                        }
                    });
                }

            }).catch(function (erro) {
                console.log(erro);
                if (typeof finalizarAguardar === 'function') {
                    finalizarAguardar();
                }
            });

            return false;
        }

        function sumirMensagem() {
            cardErro.style.display = "none";
        }
    </script>

</body>

</html>
