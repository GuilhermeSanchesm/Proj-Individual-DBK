<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DBK</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>

      <div class="container">
        <div class="lado-esquerdo">
        </div>

        <div class="lado-direito">
            <div class="topo">
                <div class="abas">
                    <div class="aba"><a href="./cadastro.html">Cadastro</a></div>
                    <div class="aba aba-ativa"><a href="./login.html">Login</a></div>
                </div>
                <a href="./index.html">
                    <div class="btn-voltar">Voltar</div>
                </a>
            </div>

            <div class="titulo">
                <div class="titulo-destaque">LOGIN</div>
            </div>

            <div class="formulario">
                <div class="campo campo-inteiro">
                    <div class="rotulo">Email:</div>
                    <input type="text" placeholder="Login" id="email_input">
                </div>
                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="*****" id="senha_input" onkeyup="validar_seguranca()">
                    <div id="validar"></div>
                </div>

                <div class="btn-finalizar" onclick="cadastrar()">ENTRAR <img src="./Assets/img-login.png" alt=""></div>
                <div id="mensagem_cadastro"></div>

            </div>
        </div>
    </div>

</body>

</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
