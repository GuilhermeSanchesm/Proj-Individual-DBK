<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | DBK</title>

    <script src="./js/sessao.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/cadastro.css">
</head>

<body>

    <div class="container">
        <div class="lado-esquerdo">
        </div>

        <div class="lado-direito">
            <div class="topo">
                <div class="abas">
                    <div class="aba aba-ativa"><a href="./cadastro.html">Cadastro</a></div>
                    <div class="aba"><a href="./login.html">Login</a></div>
                </div>
                <a href="./site-institucional.html">
                    <div class="btn-voltar">Voltar</div>
                </a>
            </div>

            <div class="titulo">
                <div class="titulo-destaque">CADASTRE-SE</div>
            </div>

            <div class="formulario">
                <div class="campo campo-inteiro">
                    <div class="rotulo">Nome:</div>
                    <input type="text" placeholder="Seu nome" id="ipt_nome">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">E-mail:</div>
                    <input type="text" placeholder="seuemail@gmail.com" id="ipt_email">
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Senha:</div>
                    <input type="password" placeholder="*******" id="ipt_senha" onkeyup="validar_seguranca()">
                    <div id="validar"></div>
                </div>

                <div class="campo campo-inteiro">
                    <div class="rotulo">Confirmação da senha:</div>
                    <input type="password" placeholder="*******" id="ipt_confirma_senha" onkeyup="validar_confirmacao()">
                    <div id="confirmacao_senha"></div>
                </div>

                <div class="btn-finalizar" onclick="cadastrar()">
                    Cadastrar <img src="./Assets/icone-cadastro.png" alt="">
                </div>
                <div id="mensagem_cadastro"></div>

            </div>
        </div>
    </div>

    <script>
        let requisitos_cadastro_global = 0;

        function validar_seguranca() {
            let requisitos_cadastro = 0;
            let senha = ipt_senha.value;
            let criterios = 1;

            if (senha.length >= 8) {
                criterios += 1;
            }
            if (senha.length >= 10) {
                criterios += 1;
            }
            if (senha.toUpperCase() !== senha) {
                criterios += 1;
            }
            if (senha.toLowerCase() !== senha) {
                criterios += 1;
            }
            if (senha == '') {
                validar.innerHTML = '';
                requisitos_cadastro = 0;
            } else if (criterios == 5) {
                validar.innerHTML = `<p style="color: #3aad16;">Senha Forte</p>`;
                requisitos_cadastro = 2;
            } else if (criterios == 4) {
                validar.innerHTML = `<p style="color: #c79e0a;">Senha Média</p>`;
                requisitos_cadastro = 1;
            } else if (criterios <= 3) {
                validar.innerHTML = `<p style="color: #be2424;">Senha Fraca</p>`;
                requisitos_cadastro = 0;
            }

            requisitos_cadastro_global = requisitos_cadastro;
        }

        function validar_confirmacao() {
            let confirma_senha = ipt_confirma_senha.value;

            if (confirma_senha == "") {
                confirmacao_senha.innerHTML = "";
            }
        }

        function cadastrar() {
            let nomeVar = ipt_nome.value;
            let emailVar = ipt_email.value;
            let senhaVar = ipt_senha.value;
            let confirma_senha = ipt_confirma_senha.value;
            let idEmpresaVincular = 1;

            if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirma_senha == "") {
                mensagem_cadastro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">Preencha todos os campos obrigatórios!</p>`;
                return false;
            } else if (!emailVar.includes('@') || emailVar.length <= 4) {
                mensagem_cadastro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">Insira um E-mail válido contendo "@"!</p>`;
                return false;
            } else if (confirma_senha !== senhaVar) {
                mensagem_cadastro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">As senhas informadas não são iguais!</p>`;
                return false;
            } else if (requisitos_cadastro_global < 1) {
                mensagem_cadastro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">Sua senha atual é muito fraca. Crie outra!</p>`;
                return false;
            }

            fetch("/usuarios/cadastrar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    nomeServer: nomeVar,
                    emailServer: emailVar,
                    senhaServer: senhaVar,
                    idEmpresaVincularServer: idEmpresaVincular
                }),
            })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    mensagem_cadastro.innerHTML = `<p style="color: #3aad16; font-size: 16px; font-weight: 600; margin-top: 10px;">Cadastro realizado com sucesso! Redirecionando...</p>`;

                    setTimeout(() => {
                        window.location = "login.html";
                    }, "2000");

                } else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);
                mensagem_cadastro.innerHTML = `<p style="color: #be2424; margin-top: 10px; font-weight: 600;">Houve um erro ao tentar realizar o cadastro no servidor.</p>`;
            });

            return false;
        }

        function sumirMensagem() {
            mensagem_cadastro.innerHTML = "";
        }
    </script>

</body>

</html>
